<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Schedulr">
  <title>Schedulr</title>
  <rect width="100" height="100" rx="22" fill="#2A0B22"/>
  <!--
    A bell whose clapper is a clock hand. The bell is the notification; the hand is the schedule.
    Drawn as one silhouette with the dial punched out of it, so the mask variant is the same
    geometry with the colours removed.
  -->
  <g fill="#C7278C">
    <circle cx="50" cy="20" r="4.5"/>
    <path d="M50 24c13.5 0 20 11.4 20 26.5 0 9 1.4 13.6 4.6 17.3 1.6 1.9.3 4.7-2.2 4.7H27.6c-2.5 0-3.8-2.8-2.2-4.7C28.6 64.1 30 59.5 30 50.5 30 35.4 36.5 24 50 24Z"/>
    <path d="M41.5 76h17a8.5 8.5 0 0 1-17 0Z"/>
  </g>
  <!-- The dial, punched out of the bell's face. -->
  <circle cx="50" cy="49" r="14" fill="#2A0B22"/>
  <circle cx="50" cy="49" r="14" fill="none" stroke="#F4A6D6" stroke-width="2.5"/>
  <!-- Hands at 9:00 — readable at 16px, where 3:00 reads as a single horizontal smudge. -->
  <path d="M50 49V39.5M50 49h-7.5" fill="none" stroke="#F4A6D6" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="49" r="2.2" fill="#F4A6D6"/>
</svg>
