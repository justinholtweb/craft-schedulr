<?xml version="1.0" encoding="UTF-8"?>
<!--
  Control-panel nav mask: the bell on its own, black on transparent, no tile.

  The same geometry as src/icon.svg — the dial is a hole in the silhouette (evenodd) and the hands
  are filled shapes, so Craft can recolour it with nothing left over.

  The transform maps the bell's bounds (69 units tall, centred on 50,50) into a 92-unit box
  centred in 100x100.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <title>Schedulr</title>
    <g fill="#000000" transform="translate(50 50) scale(1.3333) translate(-50 -50)">
        <path fill-rule="evenodd" d="M50 15.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 8.5c13.5 0 20 11.4 20 26.5 0 9 1.4 13.6 4.6 17.3 1.6 1.9.3 4.7-2.2 4.7H27.6c-2.5 0-3.8-2.8-2.2-4.7C28.6 64.1 30 59.5 30 50.5 30 35.4 36.5 24 50 24Zm0 13a12 12 0 1 0 0 24 12 12 0 0 0 0-24Z"/>
        <rect x="48.5" y="39.5" width="3" height="11" rx="1.5"/>
        <rect x="42.5" y="47.5" width="9" height="3" rx="1.5"/>
        <circle cx="50" cy="49" r="2.4"/>
        <path d="M41.5 76h17a8.5 8.5 0 0 1-17 0Z"/>
    </g>
</svg>
